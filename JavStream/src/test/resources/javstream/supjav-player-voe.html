<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>...</title>
<style media="screen">
* {
    margin: 0;
    padding: 0;
    list-style: none;
    box-sizing: border-box;
}
      body {
        overflow: hidden;
        /*margin: 0px;*/
        /*background-color: rgb(2, 2, 2);*/
        /*        background: url('');*/
        /*background-size: cover;*/
        /*background-repeat: no-repeat;*/
        /*min-height: 100%;*/
              }
      .outer {
        display: table;
        position: absolute;
        height: 100%;
        width: 100%;
      }

      .middle {
        display: table-cell;
        vertical-align: middle;
      }

      .inner {
        margin-left: auto;
        margin-right: auto;
        width: 90px;
        color: white;
        text-align: center;
        background: black;
        background: #000000b3;
        border-radius: 6px;
      }
      .footer{
        position: absolute;
        bottom: 3px;
        right: 3px;
        color: grey;
        font-size: 7px;
      }

      .footer a{
        text-decoration: none;
        color: grey;
      }

      .playbutton {
        width: fit-content;
        border-radius: 3px;
        margin: 0 auto;
        cursor: pointer;
      }
      .playbutton span {
        font-size: 50px;
        top: 50%;
        left: 50%;
        transform: translate3d(-50%,-50%,0);
        position: absolute;
        width: 90px;
        height: 60px;
        background-color: #333;
        box-shadow: 0 0 30px rgba(0,0,0,.6);
           border-radius: 6px;
      }
      .playbutton span:before {
          content: "";
          border-style: solid;
         border-width: 15px 0 15px 26px;
          border-color: transparent transparent transparent #fff;
          position: absolute;
          top: 50%;
           left: 50%;
          transform: translate3d(-50%,-50%,0);
}

      @-moz-document url-prefix() {
  .playbutton span {
    font-size: 42px;
  }
}

iframe {
    display: block; /* iframes are inline by default */
    background: #000;
    border: none; /* Reset default border */
    height: 100vh; /* Viewport-relative units */
    width: 100vw;
}
    </style>
</head>
<body>
<div class="outer">
<div class="middle">

<div class="inner">
<h1></h1>
<p><br><span id="loader"></span></p>
</div>
</div>
</div>
<script type="text/javascript">
function show_continue() {
    var inner=document.getElementsByClassName('inner')[0];
    inner.innerHTML = '<div onclick="start_player()" class="playbutton"> <span></span></div>';
}


var intv = setInterval(function() {
    if (document.getElementById('loader').innerHTML!="") {
        document.getElementById('loader').innerHTML +="";
    } else{
        clearInterval(intv);
        //show_continue();
    }
}, 100);
function start_player() {
    var OLID = 'de3fc8e544769c51bd62c08bb6e9cfee25d27d3d70e735bde4ffba06a10f2129557e4a1418a040de2fbeaec85251657d5b8c9b26fdfbb54fef4cad7eaf8a6b32';
    OLID = OLID.split('').reverse().join('');
    document.body.innerHTML='<iframe frameborder="0" src="?c='+OLID+'" allowfullscreen scrolling="no" style="display: block; background: #000; border: none; height: 100 vh ; width: 100 vw ;"></iframe>';
}
start_player();
//setTimeout("start_player()",101);
if (top.location.href == location.href) {
    document.body.innerHTML='404';
}

</script>
</body>
</html>
